name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Builds without Nix, from system packages only. Ubuntu 24.04 packages neither
# SDL3 nor GLFW 3.4, so CMake fetches and builds them: the X11, Wayland, EGL
# and IBus development packages are theirs.
#
# Skia takes ICU, HarfBuzz, FreeType and Fontconfig from the system and
# downloads its pinned gn (and ninja, when none is installed). Its build is
# long, so its output directory is cached per Skia commit and build script.

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 \
            ninja-build \
            libgl-dev \
            libicu-dev \
            libharfbuzz-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl-dev libdbus-1-dev libibus-1.0-dev

      - name: Find the Skia commit
        id: skia
        run: echo "commit=$(git rev-parse HEAD:extlib/external/skia)" >> "$GITHUB_OUTPUT"

      - name: Restore Skia
        id: skia-cache
        uses: actions/cache/restore@v6
        with:
          path: build/debug/extlib/skia/build
          key: skia-${{ runner.os }}-${{ runner.arch }}-${{ steps.skia.outputs.commit }}-${{ hashFiles('extlib/skia/CMakeLists.txt', 'extlib/skia/skia_build.sh.in') }}

      # Psychic UI needs C++23 deducing this (GCC 14+); noble's default is GCC 13.
      # Skia's gn build gets the same compilers from CMake.
      - name: Configure
        run: cmake --preset debug -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14

      # On its own, so a Skia that built is cached even if the rest fails
      - name: Build Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: cmake --build --preset debug --target skia-build

      - name: Save Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/debug/extlib/skia/build
          key: ${{ steps.skia-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset debug -j"$(nproc)"

      - name: Test
        run: ctest --preset debug

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install icu4c harfbuzz sdl3 glfw ninja

      - name: Find the Skia commit
        id: skia
        run: echo "commit=$(git rev-parse HEAD:extlib/external/skia)" >> "$GITHUB_OUTPUT"

      - name: Restore Skia
        id: skia-cache
        uses: actions/cache/restore@v6
        with:
          path: build/debug/extlib/skia/build
          key: skia-${{ runner.os }}-${{ runner.arch }}-${{ steps.skia.outputs.commit }}-${{ hashFiles('extlib/skia/CMakeLists.txt', 'extlib/skia/skia_build.sh.in') }}

      - name: Configure
        run: cmake --preset debug

      - name: Build Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: cmake --build --preset debug --target skia-build

      - name: Save Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/debug/extlib/skia/build
          key: ${{ steps.skia-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset debug -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --preset debug
